spring:
  application:
    name: api-debug-agent
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    openai:
      # OpenRouter, OpenAI-uyumlu /chat/completions konusur
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY:}
      chat:
        options:
          # Cevabin JSON olmasi prompt metnine degil sozlesmeye baglansin.
          # Model seviyesindeki bu varsayilan, ChatClientLlmClient'in gonderdigi
          # generic ChatOptions ile merge edilir; o yalnizca model + maxTokens tasir.
          response-format:
            type: JSON_OBJECT

server:
  port: 8081

target:
  base-url: http://localhost:8080

web:
  cors:
    allowed-origins: http://localhost:5173

llm:
  enabled: true
  provider: openrouter          # anthropic | openrouter
  providers:
    anthropic:
      model: claude-sonnet-5
      max-tokens: 3000
    openrouter:
      # OpenRouter model kimligi: <saglayici>/<model>. Sabit bir model olmali;
      # openrouter/free bir router'dir ve her cagrida rastgele bir ucretsiz
      # modele yonlenir, o yuzden kullanilmiyor.
      model: google/gemma-4-26b-a4b-it:free
      # Ucretsiz havuzdaki modeller reasoning uretir ve reasoning token'lari da
      # bu butceden duser; 10 bulguluk Turkce cikti icin 3000 yetmiyordu.
      max-tokens: 8000

analysis:
  # demo-api'nin /internal/logs limiti @Max(5000); tavanin altinda kalmak, buyuk
  # sayfalarda log penceresini erken doldurup tekrar sayilarini oldugundan kucuk
  # gosteriyordu. Pencere yine de dolabilir; o durum rapordaki logsTruncated ile
  # bildiriliyor.
  log-limit: 5000
  n-plus-one:
    min-repeat: 5
