spring:
  application:
    name: api-debug-agent
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    openai:
      # OpenRouter, OpenAI-uyumlu /chat/completions konusur
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY:}

server:
  port: 8081

target:
  base-url: http://localhost:8080

web:
  cors:
    allowed-origins: http://localhost:5173

llm:
  enabled: true
  provider: anthropic          # anthropic | openrouter
  providers:
    anthropic:
      model: claude-sonnet-5
      max-tokens: 3000
    openrouter:
      model: openai/gpt-5      # OpenRouter model kimligi: <saglayici>/<model>
      max-tokens: 3000

analysis:
  log-limit: 1000
  n-plus-one:
    min-repeat: 5
